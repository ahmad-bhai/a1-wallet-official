<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A1 Wallet</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="app-container">
        <header class="user-profile">
            <div class="profile-info">
                <h2 id="u_name">Loading...</h2>
                <p id="u_user">@username</p>
                <small>UID: <span id="u_id">000000</span></small>
            </div>
            <div class="status-dot"></div>
        </header>

        <section class="balance-section">
            <p>Main Balance</p>
            <h1 id="balance-display">$0.00</h1>
            <div class="balance-footer">Secure Wallet v2.0</div>
        </section>

        <nav class="action-grid">
            <div class="card" onclick="location.href='deposit.html'">
                <img src="deposit.png" alt="Deposit">
                <span>Deposit</span>
            </div>
            <div class="card" onclick="location.href='send.html'">
                <img src="send.png" alt="Send">
                <span>Send</span>
            </div>
            <div class="card" onclick="location.href='exchange.html'">
                <img src="exchange.png" alt="Exchange">
                <span>Exchange</span>
            </div>
        </nav>

        <div class="history-preview">
            <h3>Recent Activity</h3>
            <div id="recent-list" class="empty-msg">No recent transactions</div>
        </div>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
